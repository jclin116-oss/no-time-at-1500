<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>LINE 新聞輿情發送內容編輯</title>
    <style>
        body { font-family: sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        textarea { width: 100%; height: 220px; padding: 12px; font-size: 15px; box-sizing: border-box; font-family: monospace; }
        button { background: #00B900; color: white; border: none; padding: 10px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #009900; }
        .status { margin-top: 15px; font-weight: bold; }
        .preview-box { background: #f1f8ff; border-left: 4px solid #0366d6; padding: 12px; margin-bottom: 20px; white-space: pre-wrap; font-family: monospace; font-size: 14px; }
        h3 { margin-bottom: 8px; }
    </style>
</head>
<body>
    <h2>LINE 輿情訊息編輯器</h2>

    <h3>📌 目前 GitHub 上排定會發送的內容：</h3>
    <div id="previewContent" class="preview-box">正在載入目前排定內容...</div>

    <form id="msgForm">
        <h3>✏️ 編輯下次發送內容（已自動帶入今日預設範本）：</h3>
        <textarea id="messageText" required></textarea><br>
        <button type="submit">更新並儲存至 GitHub</button>
    </form>
    
    <div id="status" class="status"></div>

    <script>
        const REPO = "jclin116-oss/no-time-at-1500";
        const FILE_PATH = "message.txt";
        
        // 👉 請在此處直接填入你的 GitHub Token，之後就不用再手動輸入
        const BUILT_IN_TOKEN = "YOUR_TOKEN_HERE";

        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;

            const defaultText = `【基隆區處轄區-今日04:00~15:00區間新聞輿情】\n搜尋時間：${todayStr} 15:00\n❌11小時內尚無本處轄區新聞。`;
            
            document.getElementById('messageText').value = defaultText;
            fetchCurrentContent(defaultText);
        });

        async function fetchCurrentContent(defaultText) {
            const url = `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`;
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    const content = decodeURIComponent(escape(window.atob(data.content)));
                    document.getElementById('previewContent').innerText = content;
                } else {
                    document.getElementById('previewContent').innerText = defaultText;
                }
            } catch (e) {
                document.getElementById('previewContent').innerText = defaultText;
            }
        }

        document.getElementById('msgForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = BUILT_IN_TOKEN.trim();
            const content = document.getElementById('messageText').value;
            const statusDiv = document.getElementById('status');

            if (!token || token === "YOUR_TOKEN_HERE") {
                statusDiv.style.color = 'red';
                statusDiv.innerText = '❌ 請先在程式碼中填入你的 GitHub Token';
                return;
            }

            statusDiv.style.color = '#333';
            statusDiv.innerText = '⏳ 正在檢查並儲存至 GitHub...';

            const url = `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`;

            try {
                let sha = '';
                const getRes = await fetch(url);
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                const encodedContent = btoa(unescape(encodeURIComponent(content)));
                const bodyData = {
                    message: "Update message via web interface",
                    content: encodedContent,
                    sha: sha ? sha : undefined
                };

                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(bodyData)
                });

                if (putRes.ok) {
                    statusDiv.style.color = 'green';
                    statusDiv.innerText = '✅ 儲存成功！上方預覽已同步更新。';
                    document.getElementById('previewContent').innerText = content;
                } else {
                    const errJson = await putRes.json();
                    statusDiv.style.color = 'red';
                    statusDiv.innerText = '❌ 儲存失敗: ' + (errJson.message || '未知錯誤');
                }
            } catch (err) {
                statusDiv.style.color = 'red';
                statusDiv.innerText = '❌ 網路錯誤或 Token 權限不足';
            }
        });
    </script>
</body>
</html>
